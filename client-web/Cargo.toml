[package]
name = "client-web"
version = "0.1.0"
edition = "2024"

[dependencies]
dioxus = { version = "0.7.1", features = ["router"] }
futures-channel = "0.3"
log = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
base64 = "0.22"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
spacetimedb-sdk = "2.13.0"

[target.'cfg(target_arch = "wasm32")'.dependencies]
spacetimedb-sdk = { version = "2.13.0", features = ["browser"] }
getrandom = { version = "0.3", features = ["wasm_js"] }
wasm-bindgen = "0.2"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
    "Window",
    "Document",
    "Element",
    "EventTarget",
    "HtmlCanvasElement",
    "CanvasRenderingContext2d",
    "HtmlImageElement",
    "Navigator",
    "Clipboard",
    "Storage",
    "Location",
    "Url",
    "UrlSearchParams",
    "Request",
    "RequestInit",
    "Response",
    "Headers"
] }
wasm-bindgen-futures = "0.4"

[features]
default = ["web"]
web = ["dioxus/web"]
desktop = ["dioxus/desktop"]

[build-dependencies]
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }

